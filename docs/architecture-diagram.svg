<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="glowBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Animated Pulse Keyframes -->
    <style>
      .pulse-line {
        stroke-dasharray: 8, 8;
        animation: dash 20s linear infinite;
      }
      .fast-pulse {
        stroke-dasharray: 6, 6;
        animation: dash 10s linear infinite;
      }
      @keyframes dash {
        to {
          stroke-dashoffset: -1000;
        }
      }
      .glow-node {
        animation: breathe 3s ease-in-out infinite alternate;
      }
      @keyframes breathe {
        0% { opacity: 0.7; filter: drop-shadow(0 0 2px #3b82f6); }
        100% { opacity: 1; filter: drop-shadow(0 0 10px #8b5cf6); }
      }
      .text-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; }
      .text-body { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; }
      .text-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="620" rx="20" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Subtle Background Grid -->
  <g opacity="0.1" stroke="#94a3b8" stroke-width="0.5">
    <line x1="100" y1="0" x2="100" y2="620" />
    <line x1="250" y1="0" x2="250" y2="620" />
    <line x1="500" y1="0" x2="500" y2="620" />
    <line x1="750" y1="0" x2="750" y2="620" />
    <line x1="900" y1="0" x2="900" y2="620" />
    <line x1="0" y1="120" x2="1000" y2="120" />
    <line x1="0" y1="280" x2="1000" y2="280" />
    <line x1="0" y1="440" x2="1000" y2="440" />
  </g>

  <!-- Title & Header Bar -->
  <g transform="translate(50, 40)">
    <rect x="-10" y="-15" width="40" height="40" rx="10" fill="#2563eb" filter="url(#softGlow)" />
    <text x="10" y="10" fill="#ffffff" font-size="20" text-anchor="middle" class="text-title">✦</text>
    <text x="45" y="6" fill="#ffffff" font-size="20" class="text-title">AI Career OS &amp; ATS Platform</text>
    <text x="45" y="24" fill="#94a3b8" font-size="12" class="text-body">End-to-End Enterprise Architecture &amp; Intelligence Flow</text>
  </g>

  <!-- Badges Top Right -->
  <g transform="translate(680, 32)">
    <rect x="0" y="0" width="115" height="26" rx="13" fill="#1e293b" stroke="#334155" />
    <circle cx="12" cy="13" r="4" fill="#10b981" />
    <text x="24" y="17" fill="#cbd5e1" font-size="10" class="text-mono">Next.js 14 App</text>

    <rect x="125" y="0" width="135" height="26" rx="13" fill="#1e293b" stroke="#334155" />
    <circle cx="137" cy="13" r="4" fill="#6366f1" />
    <text x="149" y="17" fill="#cbd5e1" font-size="10" class="text-mono">FastAPI + PyTorch</text>
  </g>

  <!-- ==================== FLOW CONNECTIONS (ANIMATED) ==================== -->
  <g stroke-width="2.5" fill="none">
    <!-- LinkedIn to Auth -->
    <path d="M 170 180 L 170 230" stroke="#0077b5" class="fast-pulse" />
    <!-- Client to Frontend Core -->
    <path d="M 280 290 L 360 290" stroke="#3b82f6" class="fast-pulse" />
    <!-- Frontend to API Gateway -->
    <path d="M 570 290 L 640 290" stroke="url(#glowBlue)" class="fast-pulse" />
    <!-- Backend to AI Intelligence -->
    <path d="M 760 230 L 760 170" stroke="#8b5cf6" class="pulse-line" />
    <!-- Backend to Storage -->
    <path d="M 760 350 L 760 410" stroke="#06b6d4" class="pulse-line" />
    <!-- Pipeline to Outputs -->
    <path d="M 465 350 L 465 410" stroke="#10b981" class="fast-pulse" />
  </g>

  <!-- ==================== NODE 1: AUTH & IDENTITY ==================== -->
  <g transform="translate(60, 110)">
    <rect width="220" height="75" rx="14" fill="url(#blueCard)" stroke="#0077b5" stroke-width="1.5" class="glow-node" />
    <circle cx="28" cy="28" r="14" fill="#0077b5" />
    <text x="28" y="33" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" class="text-title">in</text>
    <text x="52" y="26" fill="#ffffff" font-size="13" class="text-title">LinkedIn OIDC / OAuth</text>
    <text x="52" y="42" fill="#94a3b8" font-size="10" class="text-body">OpenID, Profile, PDF Import</text>
    <rect x="52" y="50" width="145" height="15" rx="4" fill="#0369a1" fill-opacity="0.3" />
    <text x="56" y="61" fill="#38bdf8" font-size="9" class="text-mono">Zero-hallucination sync</text>
  </g>

  <!-- ==================== NODE 2: CLIENT PORTAL ==================== -->
  <g transform="translate(60, 230)">
    <rect width="220" height="120" rx="14" fill="url(#blueCard)" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="28" fill="#ffffff" font-size="13" class="text-title">Candidate Entry Portal</text>
    <text x="20" y="44" fill="#64748b" font-size="10" class="text-mono">/welcome ➔ /login ➔ /onboarding</text>

    <g transform="translate(20, 56)">
      <rect x="0" y="0" width="180" height="22" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <text x="8" y="15" fill="#e2e8f0" font-size="10" class="text-body">🎯 Goal &amp; Seniority Personalization</text>
    </g>
    <g transform="translate(20, 84)">
      <rect x="0" y="0" width="180" height="22" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <text x="8" y="15" fill="#e2e8f0" font-size="10" class="text-body">🐙 GitHub &amp; Resume Ingestion</text>
    </g>
  </g>

  <!-- ==================== NODE 3: FRONTEND CORE ==================== -->
  <g transform="translate(360, 195)">
    <rect width="210" height="190" rx="16" fill="url(#blueCard)" stroke="#3b82f6" stroke-width="2" filter="url(#softGlow)" />
    <rect x="0" y="0" width="210" height="35" rx="16" fill="#1e3a8a" fill-opacity="0.5" />
    <text x="16" y="23" fill="#60a5fa" font-size="12" class="text-title">NEXT.JS 14 APP ROUTER</text>

    <g transform="translate(16, 48)">
      <text x="0" y="12" fill="#f8fafc" font-size="11" class="text-title">Command Dashboard</text>
      <text x="0" y="26" fill="#94a3b8" font-size="9" class="text-body">Career Readiness: 78/100 Gauge</text>

      <text x="0" y="48" fill="#f8fafc" font-size="11" class="text-title">24+ Template Studio</text>
      <text x="0" y="62" fill="#94a3b8" font-size="9" class="text-body">Inter, Roboto, Georgia • 8 Palettes</text>

      <text x="0" y="84" fill="#f8fafc" font-size="11" class="text-title">WYSIWYG Resume Canvas</text>
      <text x="0" y="98" fill="#94a3b8" font-size="9" class="text-body">Single, 2-Col Split, Compact, Timeline</text>

      <text x="0" y="120" fill="#f8fafc" font-size="11" class="text-title">Zustand Editor State</text>
      <text x="0" y="132" fill="#94a3b8" font-size="9" class="text-mono">Instant Reactive Updates</text>
    </g>
  </g>

  <!-- ==================== NODE 4: BACKEND FASTAPI ==================== -->
  <g transform="translate(640, 210)">
    <rect width="240" height="160" rx="16" fill="url(#blueCard)" stroke="#8b5cf6" stroke-width="2" filter="url(#softGlow)" />
    <rect x="0" y="0" width="240" height="35" rx="16" fill="#4c1d95" fill-opacity="0.5" />
    <text x="16" y="23" fill="#c084fc" font-size="12" class="text-title">FASTAPI ENGINE (PYTHON 3.11)</text>

    <g transform="translate(16, 48)" fill="#cbd5e1" font-size="10" class="text-body">
      <text x="0" y="14">⚡ /api/v1/templates (24+ Designs)</text>
      <text x="0" y="32">⚡ /api/v1/chat (Voice &amp; 12 Indian Langs)</text>
      <text x="0" y="50">⚡ /api/v1/resume/tailor (Job Gap Match)</text>
      <text x="0" y="68">⚡ /api/v1/ats/analyze (5-Factor Scorer)</text>
      <text x="0" y="86">⚡ /api/v1/applications (Kanban Tracker)</text>
      <text x="0" y="104">⚡ /api/v1/export (PDF, DOCX, TXT)</text>
    </g>
  </g>

  <!-- ==================== NODE 5: AI & SPEECH INTELLIGENCE ==================== -->
  <g transform="translate(640, 70)">
    <rect width="240" height="100" rx="14" fill="url(#blueCard)" stroke="#ec4899" stroke-width="1.5" class="glow-node" />
    <text x="16" y="24" fill="#f472b6" font-size="12" class="text-title">🤖 AI CAREER &amp; VOICE BRAIN</text>

    <g transform="translate(16, 38)" fill="#cbd5e1" font-size="10" class="text-body">
      <text x="0" y="14">✦ Google XYZ Quantifier &amp; Rewriter</text>
      <text x="0" y="30">✦ Voice-to-Voice Mock Interview Coach</text>
      <text x="0" y="46">✦ Hinglish &amp; 12 Indian Languages TTS</text>
      <text x="0" y="58" fill="#f43f5e" font-size="9" class="text-mono">Zero Hallucination Guardrails</text>
    </g>
  </g>

  <!-- ==================== NODE 6: DATABASE & VECTOR STORAGE ==================== -->
  <g transform="translate(640, 410)">
    <rect width="240" height="110" rx="14" fill="url(#blueCard)" stroke="#06b6d4" stroke-width="1.5" />
    <text x="16" y="24" fill="#22d3ee" font-size="12" class="text-title">🗄️ PERSISTENCE &amp; VECTOR RETRIEVAL</text>

    <g transform="translate(16, 40)" fill="#cbd5e1" font-size="10" class="text-body">
      <text x="0" y="14">• PostgreSQL 16 + pgvector Embeddings</text>
      <text x="0" y="30">• SQLite aiosqlite (Local Dev Fallback)</text>
      <text x="0" y="46">• Redis Caching &amp; Session Rate Limiter</text>
      <text x="0" y="62">• Strict Data Wiping &amp; Privacy Control</text>
    </g>
  </g>

  <!-- ==================== NODE 7: HIGH-VELOCITY OUTPUTS ==================== -->
  <g transform="translate(320, 410)">
    <rect width="290" height="110" rx="14" fill="url(#blueCard)" stroke="#10b981" stroke-width="1.5" />
    <text x="16" y="24" fill="#34d399" font-size="12" class="text-title">⚡ MULTI-FORMAT EXPORT &amp; APPLICATION</text>

    <g transform="translate(16, 40)" fill="#cbd5e1" font-size="10" class="text-body">
      <text x="0" y="14">📄 Word (.docx) &amp; Print CSS Pixel-Perfect PDF</text>
      <text x="0" y="30">📋 Plain-Text ASCII (.txt) for ATS Textareas</text>
      <text x="0" y="46">🌐 Vanity Public Web Link (/r/slug)</text>
      <text x="0" y="62">📊 6-Stage Application Kanban (Saved ➔ Offer)</text>
    </g>
  </g>

  <!-- Footer Indicator -->
  <text x="50" y="585" fill="#64748b" font-size="11" class="text-mono">Architecture: Production Decoupled Next.js 14 Frontend + FastAPI Async Backend + pgvector + OIDC</text>
  <text x="950" y="585" fill="#10b981" font-size="11" text-anchor="end" class="text-mono">● 100% Tested &amp; Build Ready</text>
</svg>
