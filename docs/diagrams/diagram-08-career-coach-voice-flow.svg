<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Accent Glow -->
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Drop Shadows and Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f97316" />
    </marker>
  </defs>

  <style>
    .title-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #ffffff; }
    .desc-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11px; fill: #94a3b8; }
    .badge-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 800; fill: #f97316; letter-spacing: 1.5px; }
    .node-title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #f8fafc; }
    .node-desc { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 10px; fill: #94a3b8; }
    .flow-label { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 9px; fill: #38bdf8; font-weight: 500; }

    /* Animations */
    @keyframes pulseGlow {
      0% { stroke-opacity: 0.4; }
      50% { stroke-opacity: 1; }
      100% { stroke-opacity: 0.4; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes indicatorPulse {
      0% { r: 3px; opacity: 1; }
      50% { r: 6px; opacity: 0.4; }
      100% { r: 3px; opacity: 1; }
    }

    .animated-border { stroke: #f97316; animation: pulseGlow 3s infinite ease-in-out; }
    .animated-flow { stroke: #f97316; stroke-dasharray: 6, 6; animation: flowLine 1.8s linear infinite; }
    .pulse-dot { fill: #f97316; animation: indicatorPulse 2s infinite ease-in-out; }
  </style>

  <!-- Container Box -->
  <rect x="10" y="10" width="980" height="500" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  <rect x="10" y="10" width="980" height="500" rx="16" fill="none" class="animated-border" stroke-width="1.5" />

  <!-- Header Section -->
  <g transform="translate(35, 30)">
    <rect x="0" y="0" width="170" height="22" rx="11" fill="#0f172a" stroke="#f97316" stroke-width="1.2" />
    <circle cx="12" cy="11" r="4" class="pulse-dot" />
    <text x="24" y="14" class="badge-text">VOICE AI & MULTILINGUAL</text>

    <text x="0" y="44" class="title-text">Real-Time Conversational Voice AI & 12 Indian Languages</text>
    <text x="0" y="60" class="desc-text">Low-latency voice-to-voice career coaching supporting English and 12 Indian regional languages.</text>
  </g>

  <!-- Flow Lines (Connections) -->
  <g id="connections">
    <line x1="230" y1="170" x2="270" y2="170" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="215.0" y="158.0" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="250.0" y="169.0" text-anchor="middle" class="flow-label">Audio Stream</text>
    <line x1="460" y1="170" x2="500" y2="170" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="445.0" y="158.0" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="480.0" y="169.0" text-anchor="middle" class="flow-label">Normalized STT</text>
    <line x1="690" y1="170" x2="730" y2="170" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="675.0" y="158.0" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="710.0" y="169.0" text-anchor="middle" class="flow-label">RAG Context</text>
    <line x1="820" y1="210" x2="820" y2="290" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="785.0" y="238.0" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="820.0" y="249.0" text-anchor="middle" class="flow-label">LLM Response</text>
    <line x1="730" y1="330" x2="660" y2="330" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="660.0" y="318.0" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="695.0" y="329.0" text-anchor="middle" class="flow-label">Localized Text</text>
    <line x1="450" y1="330" x2="380" y2="330" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="380.0" y="318.0" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="415.0" y="329.0" text-anchor="middle" class="flow-label">Audio Stream</text>
  </g>

  <!-- Node Elements -->
  <g id="nodes">
    <g transform="translate(40, 130)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="190" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#38bdf8" />
      <text x="14" y="24" class="node-title">Candidate Voice Input</text>
      <text x="14" y="44" class="node-desc">Microphone audio stream via Web</text>
      <text x="14" y="58" class="node-desc">Speech API / Whisper</text>
    </g>
    <g transform="translate(270, 130)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="190" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#f97316" />
      <text x="14" y="24" class="node-title">Language Detector</text>
      <text x="14" y="44" class="node-desc">Auto-detects Hindi, Tamil,</text>
      <text x="14" y="58" class="node-desc">Telugu, Bengali, Marathi, etc.</text>
    </g>
    <g transform="translate(500, 130)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="190" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#6366f1" />
      <text x="14" y="24" class="node-title">Career Context Engine</text>
      <text x="14" y="44" class="node-desc">Injects candidate resume,</text>
      <text x="14" y="58" class="node-desc">target role, and career goals</text>
    </g>
    <g transform="translate(730, 130)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="180" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#a855f7" />
      <text x="14" y="24" class="node-title">Gemini 1.5 Pro Brain</text>
      <text x="14" y="44" class="node-desc">Synthesizes hyper-personalized</text>
      <text x="14" y="58" class="node-desc">career advice</text>
    </g>
    <g transform="translate(730, 290)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="180" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#10b981" />
      <text x="14" y="24" class="node-title">Regional Localization</text>
      <text x="14" y="44" class="node-desc">Translates & adapts culturally</text>
      <text x="14" y="58" class="node-desc">to 12 Indian dialects</text>
    </g>
    <g transform="translate(450, 290)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="210" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#ec4899" />
      <text x="14" y="24" class="node-title">Neural Audio Synthesis</text>
      <text x="14" y="44" class="node-desc">Text-to-Speech playback with</text>
      <text x="14" y="58" class="node-desc">natural Indian accents</text>
    </g>
    <g transform="translate(140, 290)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="240" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#22c55e" />
      <text x="14" y="24" class="node-title">Real-Time Voice Coaching</text>
      <text x="14" y="44" class="node-desc">Interactive practice: salary</text>
      <text x="14" y="58" class="node-desc">negotiation, interview prep</text>
    </g>
  </g>
</svg>