<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Accent Glow -->
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Drop Shadows and Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981" />
    </marker>
  </defs>

  <style>
    .title-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #ffffff; }
    .desc-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11px; fill: #94a3b8; }
    .badge-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 800; fill: #10b981; letter-spacing: 1.5px; }
    .node-title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #f8fafc; }
    .node-desc { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 10px; fill: #94a3b8; }
    .flow-label { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 9px; fill: #38bdf8; font-weight: 500; }

    /* Animations */
    @keyframes pulseGlow {
      0% { stroke-opacity: 0.4; }
      50% { stroke-opacity: 1; }
      100% { stroke-opacity: 0.4; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes indicatorPulse {
      0% { r: 3px; opacity: 1; }
      50% { r: 6px; opacity: 0.4; }
      100% { r: 3px; opacity: 1; }
    }

    .animated-border { stroke: #10b981; animation: pulseGlow 3s infinite ease-in-out; }
    .animated-flow { stroke: #10b981; stroke-dasharray: 6, 6; animation: flowLine 1.8s linear infinite; }
    .pulse-dot { fill: #10b981; animation: indicatorPulse 2s infinite ease-in-out; }
  </style>

  <!-- Container Box -->
  <rect x="10" y="10" width="980" height="500" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  <rect x="10" y="10" width="980" height="500" rx="16" fill="none" class="animated-border" stroke-width="1.5" />

  <!-- Header Section -->
  <g transform="translate(35, 30)">
    <rect x="0" y="0" width="170" height="22" rx="11" fill="#0f172a" stroke="#10b981" stroke-width="1.2" />
    <circle cx="12" cy="11" r="4" class="pulse-dot" />
    <text x="24" y="14" class="badge-text">TELEMETRY & CAMPAIGNS</text>

    <text x="0" y="44" class="title-text">SaaS Admin Telemetry & Real-Time Campaign Engine</text>
    <text x="0" y="60" class="desc-text">Real-time SaaS operational visibility with active user tracking, token usage, and live campaign broadcasts.</text>
  </g>

  <!-- Flow Lines (Connections) -->
  <g id="connections">
    <line x1="260" y1="170" x2="300" y2="170" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="245.0" y="158.0" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="280.0" y="169.0" text-anchor="middle" class="flow-label">User Telemetry</text>
    <line x1="520" y1="170" x2="560" y2="170" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="505.0" y="158.0" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="540.0" y="169.0" text-anchor="middle" class="flow-label">Cost Metrics</text>
    <line x1="670" y1="210" x2="670" y2="280" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="635.0" y="233.0" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="670.0" y="244.0" text-anchor="middle" class="flow-label">Campaign Trigger</text>
    <line x1="560" y1="320" x2="520" y2="320" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="505.0" y="308.0" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="540.0" y="319.0" text-anchor="middle" class="flow-label">System Alerts</text>
    <line x1="300" y1="320" x2="260" y2="320" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="245.0" y="308.0" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="280.0" y="319.0" text-anchor="middle" class="flow-label">Admin Actions</text>
  </g>

  <!-- Node Elements -->
  <g id="nodes">
    <g transform="translate(50, 130)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="210" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#0ea5e9" />
      <text x="14" y="24" class="node-title">Active User Analytics</text>
      <text x="14" y="44" class="node-desc">DAU/MAU, user retention, signup</text>
      <text x="14" y="58" class="node-desc">conversion funnels</text>
    </g>
    <g transform="translate(300, 130)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="220" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#a855f7" />
      <text x="14" y="24" class="node-title">AI Token & Cost Tracker</text>
      <text x="14" y="44" class="node-desc">Tracks Gemini API usage, prompt</text>
      <text x="14" y="58" class="node-desc">cost, and response latency</text>
    </g>
    <g transform="translate(560, 130)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="220" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#f59e0b" />
      <text x="14" y="24" class="node-title">Template Popularity Heatmap</text>
      <text x="14" y="44" class="node-desc">Most picked templates and</text>
      <text x="14" y="58" class="node-desc">download conversion rates</text>
    </g>
    <g transform="translate(560, 280)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="220" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#10b981" />
      <text x="14" y="24" class="node-title">Campaign Broadcaster</text>
      <text x="14" y="44" class="node-desc">Push real-time tip banners and</text>
      <text x="14" y="58" class="node-desc">discount campaigns to all users</text>
    </g>
    <g transform="translate(300, 280)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="220" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#ef4444" />
      <text x="14" y="24" class="node-title">System Health & Error Logs</text>
      <text x="14" y="44" class="node-desc">FastAPI uptime, database</text>
      <text x="14" y="58" class="node-desc">connection pool, error alerts</text>
    </g>
    <g transform="translate(50, 280)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="210" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#6366f1" />
      <text x="14" y="24" class="node-title">Superadmin Command Hub</text>
      <text x="14" y="44" class="node-desc">Role management, user bans,</text>
      <text x="14" y="58" class="node-desc">plan upgrades, system settings</text>
    </g>
  </g>
</svg>