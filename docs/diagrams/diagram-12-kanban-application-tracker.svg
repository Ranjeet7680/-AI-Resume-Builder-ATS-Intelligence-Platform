<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Accent Glow -->
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Drop Shadows and Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#6366f1" />
    </marker>
  </defs>

  <style>
    .title-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #ffffff; }
    .desc-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11px; fill: #94a3b8; }
    .badge-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 800; fill: #6366f1; letter-spacing: 1.5px; }
    .node-title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #f8fafc; }
    .node-desc { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 10px; fill: #94a3b8; }
    .flow-label { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 9px; fill: #38bdf8; font-weight: 500; }

    /* Animations */
    @keyframes pulseGlow {
      0% { stroke-opacity: 0.4; }
      50% { stroke-opacity: 1; }
      100% { stroke-opacity: 0.4; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes indicatorPulse {
      0% { r: 3px; opacity: 1; }
      50% { r: 6px; opacity: 0.4; }
      100% { r: 3px; opacity: 1; }
    }

    .animated-border { stroke: #6366f1; animation: pulseGlow 3s infinite ease-in-out; }
    .animated-flow { stroke: #6366f1; stroke-dasharray: 6, 6; animation: flowLine 1.8s linear infinite; }
    .pulse-dot { fill: #6366f1; animation: indicatorPulse 2s infinite ease-in-out; }
  </style>

  <!-- Container Box -->
  <rect x="10" y="10" width="980" height="500" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  <rect x="10" y="10" width="980" height="500" rx="16" fill="none" class="animated-border" stroke-width="1.5" />

  <!-- Header Section -->
  <g transform="translate(35, 30)">
    <rect x="0" y="0" width="170" height="22" rx="11" fill="#0f172a" stroke="#6366f1" stroke-width="1.2" />
    <circle cx="12" cy="11" r="4" class="pulse-dot" />
    <text x="24" y="14" class="badge-text">APPLICATION PIPELINE</text>

    <text x="0" y="44" class="title-text">Job Application Pipeline Kanban & Career Telemetry</text>
    <text x="0" y="60" class="desc-text">Full lifecycle tracking for job applications with resume version tagging and interview reminders.</text>
  </g>

  <!-- Flow Lines (Connections) -->
  <g id="connections">
    <line x1="200" y1="170" x2="230" y2="170" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="180.0" y="158.0" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="215.0" y="169.0" text-anchor="middle" class="flow-label">Apply</text>
    <line x1="390" y1="170" x2="420" y2="170" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="370.0" y="158.0" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="405.0" y="169.0" text-anchor="middle" class="flow-label">Callback</text>
    <line x1="580" y1="170" x2="610" y2="170" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="560.0" y="158.0" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="595.0" y="169.0" text-anchor="middle" class="flow-label">Advance</text>
    <line x1="770" y1="170" x2="800" y2="170" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="750.0" y="158.0" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="785.0" y="169.0" text-anchor="middle" class="flow-label">Offer!</text>
    <line x1="500" y1="210" x2="350" y2="280" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="390.0" y="233.0" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="425.0" y="244.0" text-anchor="middle" class="flow-label">Notification</text>
    <line x1="680" y1="210" x2="680" y2="280" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="645.0" y="233.0" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="680.0" y="244.0" text-anchor="middle" class="flow-label">Telemetry</text>
  </g>

  <!-- Node Elements -->
  <g id="nodes">
    <g transform="translate(40, 130)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="160" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#64748b" />
      <text x="14" y="24" class="node-title">1. Wishlist / Saved</text>
      <text x="14" y="44" class="node-desc">Target companies and saved job</text>
      <text x="14" y="58" class="node-desc">descriptions</text>
    </g>
    <g transform="translate(230, 130)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="160" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#0ea5e9" />
      <text x="14" y="24" class="node-title">2. Applied</text>
      <text x="14" y="44" class="node-desc">Resume version & tailored cover</text>
      <text x="14" y="58" class="node-desc">letter tagged</text>
    </g>
    <g transform="translate(420, 130)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="160" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#6366f1" />
      <text x="14" y="24" class="node-title">3. HR Screening</text>
      <text x="14" y="44" class="node-desc">Initial recruiter phone screen</text>
      <text x="14" y="58" class="node-desc">scheduled</text>
    </g>
    <g transform="translate(610, 130)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="160" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#a855f7" />
      <text x="14" y="24" class="node-title">4. Tech Interview</text>
      <text x="14" y="46" class="node-desc">System design & live coding rounds</text>
    </g>
    <g transform="translate(800, 130)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="160" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#22c55e" />
      <text x="14" y="24" class="node-title">5. Offer Received 🎉</text>
      <text x="14" y="44" class="node-desc">Compensation & offer</text>
      <text x="14" y="58" class="node-desc">negotiation stage</text>
    </g>
    <g transform="translate(230, 280)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="240" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#f59e0b" />
      <text x="14" y="24" class="node-title">Interview Follow-up Trigger</text>
      <text x="14" y="44" class="node-desc">Automated email reminders &</text>
      <text x="14" y="58" class="node-desc">thank-you notes</text>
    </g>
    <g transform="translate(540, 280)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="280" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#10b981" />
      <text x="14" y="24" class="node-title">Application Conversion Analytics</text>
      <text x="14" y="44" class="node-desc">Response rate (34%), Interview</text>
      <text x="14" y="58" class="node-desc">rate (21%), Offer rate (12%)</text>
    </g>
  </g>
</svg>