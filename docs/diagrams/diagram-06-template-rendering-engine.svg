<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Accent Glow -->
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Drop Shadows and Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8b5cf6" />
    </marker>
  </defs>

  <style>
    .title-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #ffffff; }
    .desc-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11px; fill: #94a3b8; }
    .badge-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 800; fill: #8b5cf6; letter-spacing: 1.5px; }
    .node-title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #f8fafc; }
    .node-desc { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 10px; fill: #94a3b8; }
    .flow-label { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 9px; fill: #38bdf8; font-weight: 500; }

    /* Animations */
    @keyframes pulseGlow {
      0% { stroke-opacity: 0.4; }
      50% { stroke-opacity: 1; }
      100% { stroke-opacity: 0.4; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes indicatorPulse {
      0% { r: 3px; opacity: 1; }
      50% { r: 6px; opacity: 0.4; }
      100% { r: 3px; opacity: 1; }
    }

    .animated-border { stroke: #8b5cf6; animation: pulseGlow 3s infinite ease-in-out; }
    .animated-flow { stroke: #8b5cf6; stroke-dasharray: 6, 6; animation: flowLine 1.8s linear infinite; }
    .pulse-dot { fill: #8b5cf6; animation: indicatorPulse 2s infinite ease-in-out; }
  </style>

  <!-- Container Box -->
  <rect x="10" y="10" width="980" height="500" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  <rect x="10" y="10" width="980" height="500" rx="16" fill="none" class="animated-border" stroke-width="1.5" />

  <!-- Header Section -->
  <g transform="translate(35, 30)">
    <rect x="0" y="0" width="170" height="22" rx="11" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2" />
    <circle cx="12" cy="11" r="4" class="pulse-dot" />
    <text x="24" y="14" class="badge-text">24+ TEMPLATES & ZERO LOSS</text>

    <text x="0" y="44" class="title-text">Multi-Template Studio Decoupled Content-Presentation</text>
    <text x="0" y="60" class="desc-text">Decoupled rendering architecture allowing candidates to switch across 24+ designs without rewriting career data.</text>
  </g>

  <!-- Flow Lines (Connections) -->
  <g id="connections">
    <line x1="250" y1="160" x2="320" y2="160" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="250.0" y="148.0" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="285.0" y="159.0" text-anchor="middle" class="flow-label">Career Facts</text>
    <line x1="540" y1="140" x2="610" y2="105" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="540.0" y="110.5" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="575.0" y="121.5" text-anchor="middle" class="flow-label">Dispatch</text>
    <line x1="540" y1="155" x2="610" y2="170" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="540.0" y="150.5" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="575.0" y="161.5" text-anchor="middle" class="flow-label">Dispatch</text>
    <line x1="540" y1="170" x2="610" y2="235" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="540.0" y="190.5" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="575.0" y="201.5" text-anchor="middle" class="flow-label">Dispatch</text>
    <line x1="540" y1="185" x2="610" y2="300" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="540.0" y="230.5" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="575.0" y="241.5" text-anchor="middle" class="flow-label">Dispatch</text>
    <line x1="540" y1="200" x2="610" y2="365" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="540.0" y="270.5" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="575.0" y="281.5" text-anchor="middle" class="flow-label">Dispatch</text>
    <line x1="370" y1="280" x2="430" y2="200" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="365.0" y="228.0" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="400.0" y="239.0" text-anchor="middle" class="flow-label">CSS Theme Injection</text>
  </g>

  <!-- Node Elements -->
  <g id="nodes">
    <g transform="translate(50, 120)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="200" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#0ea5e9" />
      <text x="14" y="24" class="node-title">Core Resume Data</text>
      <text x="14" y="44" class="node-desc">Single Source of Truth</text>
      <text x="14" y="58" class="node-desc">(Normalized JSON)</text>
    </g>
    <g transform="translate(320, 120)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="220" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#6366f1" />
      <text x="14" y="24" class="node-title">Template Dispatcher</text>
      <text x="14" y="44" class="node-desc">Resolves category, layout mode,</text>
      <text x="14" y="58" class="node-desc">typography & palette</text>
    </g>
    <g transform="translate(610, 80)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="240" height="50" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="50" rx="2" fill="#10b981" />
      <text x="14" y="24" class="node-title">ATS-Minimalist (5)</text>
      <text x="14" y="44" class="node-desc">Single-column, pure text</text>
      <text x="14" y="58" class="node-desc">hierarchy, FAANG tested</text>
    </g>
    <g transform="translate(610, 145)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="240" height="50" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="50" rx="2" fill="#38bdf8" />
      <text x="14" y="24" class="node-title">Modern Executive (5)</text>
      <text x="14" y="44" class="node-desc">Clean dual-column, modern</text>
      <text x="14" y="58" class="node-desc">header, leadership tone</text>
    </g>
    <g transform="translate(610, 210)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="240" height="50" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="50" rx="2" fill="#8b5cf6" />
      <text x="14" y="24" class="node-title">Tech & Software (5)</text>
      <text x="14" y="44" class="node-desc">Code project badges, GitHub</text>
      <text x="14" y="58" class="node-desc">links, hard skills first</text>
    </g>
    <g transform="translate(610, 275)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="240" height="50" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="50" rx="2" fill="#f59e0b" />
      <text x="14" y="24" class="node-title">Data & AI Specialist (3)</text>
      <text x="14" y="44" class="node-desc">Model metrics, Kaggle rank,</text>
      <text x="14" y="58" class="node-desc">research publications</text>
    </g>
    <g transform="translate(610, 340)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="240" height="50" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="50" rx="2" fill="#ec4899" />
      <text x="14" y="24" class="node-title">Fresher & Student (3)</text>
      <text x="14" y="44" class="node-desc">Coursework, hackathons, GPA,</text>
      <text x="14" y="58" class="node-desc">academic honors</text>
    </g>
    <g transform="translate(200, 280)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="340" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#14b8a6" />
      <text x="14" y="24" class="node-title">Live Theme Engine</text>
      <text x="14" y="44" class="node-desc">Dynamic 8 font families, 8</text>
      <text x="14" y="58" class="node-desc">color themes, 4 layout variants</text>
    </g>
  </g>
</svg>