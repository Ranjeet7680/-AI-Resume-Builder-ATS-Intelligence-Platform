<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Accent Glow -->
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Drop Shadows and Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f43f5e" />
    </marker>
  </defs>

  <style>
    .title-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #ffffff; }
    .desc-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11px; fill: #94a3b8; }
    .badge-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 800; fill: #f43f5e; letter-spacing: 1.5px; }
    .node-title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #f8fafc; }
    .node-desc { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 10px; fill: #94a3b8; }
    .flow-label { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 9px; fill: #38bdf8; font-weight: 500; }

    /* Animations */
    @keyframes pulseGlow {
      0% { stroke-opacity: 0.4; }
      50% { stroke-opacity: 1; }
      100% { stroke-opacity: 0.4; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes indicatorPulse {
      0% { r: 3px; opacity: 1; }
      50% { r: 6px; opacity: 0.4; }
      100% { r: 3px; opacity: 1; }
    }

    .animated-border { stroke: #f43f5e; animation: pulseGlow 3s infinite ease-in-out; }
    .animated-flow { stroke: #f43f5e; stroke-dasharray: 6, 6; animation: flowLine 1.8s linear infinite; }
    .pulse-dot { fill: #f43f5e; animation: indicatorPulse 2s infinite ease-in-out; }
  </style>

  <!-- Container Box -->
  <rect x="10" y="10" width="980" height="500" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  <rect x="10" y="10" width="980" height="500" rx="16" fill="none" class="animated-border" stroke-width="1.5" />

  <!-- Header Section -->
  <g transform="translate(35, 30)">
    <rect x="0" y="0" width="170" height="22" rx="11" fill="#0f172a" stroke="#f43f5e" stroke-width="1.2" />
    <circle cx="12" cy="11" r="4" class="pulse-dot" />
    <text x="24" y="14" class="badge-text">USER ENGAGEMENT & TIPS</text>

    <text x="0" y="44" class="title-text">Contextual Promotional Banner & Hiring Tip Engine</text>
    <text x="0" y="60" class="desc-text">Real-time contextual tip dispenser boosting resume quality and surfacing promotional campaigns.</text>
  </g>

  <!-- Flow Lines (Connections) -->
  <g id="connections">
    <line x1="230" y1="170" x2="270" y2="170" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="215.0" y="158.0" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="250.0" y="169.0" text-anchor="middle" class="flow-label">Event Dispatch</text>
    <line x1="470" y1="170" x2="510" y2="170" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="455.0" y="158.0" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="490.0" y="169.0" text-anchor="middle" class="flow-label">State Payload</text>
    <line x1="710" y1="170" x2="750" y2="170" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="695.0" y="158.0" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="730.0" y="169.0" text-anchor="middle" class="flow-label">Display Banner</text>
    <line x1="840" y1="210" x2="710" y2="290" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="740.0" y="238.0" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="775.0" y="249.0" text-anchor="middle" class="flow-label">User Clicks</text>
    <line x1="510" y1="320" x2="470" y2="320" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="455.0" y="308.0" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="490.0" y="319.0" text-anchor="middle" class="flow-label">Telemetry Sync</text>
  </g>

  <!-- Node Elements -->
  <g id="nodes">
    <g transform="translate(40, 130)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="190" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#64748b" />
      <text x="14" y="24" class="node-title">User Navigation Event</text>
      <text x="14" y="44" class="node-desc">Candidate views dashboard, ATS</text>
      <text x="14" y="58" class="node-desc">checker, or template studio</text>
    </g>
    <g transform="translate(270, 130)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="200" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#f43f5e" />
      <text x="14" y="24" class="node-title">Contextual State Evaluator</text>
      <text x="14" y="44" class="node-desc">Evaluates current page, ATS</text>
      <text x="14" y="58" class="node-desc">score, and missing resume fields</text>
    </g>
    <g transform="translate(510, 130)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="200" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#6366f1" />
      <text x="14" y="24" class="node-title">Tip & Tip Rule Matcher</text>
      <text x="14" y="44" class="node-desc">Matches trigger rules: low</text>
      <text x="14" y="58" class="node-desc">score, missing metrics, promo events</text>
    </g>
    <g transform="translate(750, 130)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="180" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#10b981" />
      <text x="14" y="24" class="node-title">Dynamic Banner Component</text>
      <text x="14" y="44" class="node-desc">Renders glassmorphic banner</text>
      <text x="14" y="58" class="node-desc">with actionable CTA button</text>
    </g>
    <g transform="translate(510, 280)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="200" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#f59e0b" />
      <text x="14" y="24" class="node-title">Candidate Action Tracker</text>
      <text x="14" y="44" class="node-desc">Tracks click-through rate,</text>
      <text x="14" y="58" class="node-desc">dismissal, and score improvement</text>
    </g>
    <g transform="translate(270, 280)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="200" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#0ea5e9" />
      <text x="14" y="24" class="node-title">SaaS Admin Campaign Sync</text>
      <text x="14" y="44" class="node-desc">Enables admins to publish</text>
      <text x="14" y="58" class="node-desc">system-wide announcements live</text>
    </g>
  </g>
</svg>