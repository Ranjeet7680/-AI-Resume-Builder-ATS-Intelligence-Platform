<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Accent Glow -->
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Drop Shadows and Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981" />
    </marker>
  </defs>

  <style>
    .title-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #ffffff; }
    .desc-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11px; fill: #94a3b8; }
    .badge-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 800; fill: #10b981; letter-spacing: 1.5px; }
    .node-title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #f8fafc; }
    .node-desc { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 10px; fill: #94a3b8; }
    .flow-label { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 9px; fill: #38bdf8; font-weight: 500; }

    /* Animations */
    @keyframes pulseGlow {
      0% { stroke-opacity: 0.4; }
      50% { stroke-opacity: 1; }
      100% { stroke-opacity: 0.4; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes indicatorPulse {
      0% { r: 3px; opacity: 1; }
      50% { r: 6px; opacity: 0.4; }
      100% { r: 3px; opacity: 1; }
    }

    .animated-border { stroke: #10b981; animation: pulseGlow 3s infinite ease-in-out; }
    .animated-flow { stroke: #10b981; stroke-dasharray: 6, 6; animation: flowLine 1.8s linear infinite; }
    .pulse-dot { fill: #10b981; animation: indicatorPulse 2s infinite ease-in-out; }
  </style>

  <!-- Container Box -->
  <rect x="10" y="10" width="980" height="500" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  <rect x="10" y="10" width="980" height="500" rx="16" fill="none" class="animated-border" stroke-width="1.5" />

  <!-- Header Section -->
  <g transform="translate(35, 30)">
    <rect x="0" y="0" width="170" height="22" rx="11" fill="#0f172a" stroke="#10b981" stroke-width="1.2" />
    <circle cx="12" cy="11" r="4" class="pulse-dot" />
    <text x="24" y="14" class="badge-text">END-TO-END JOURNEY</text>

    <text x="0" y="44" class="title-text">Complete Candidate Journey Lifecycle (Zero to Hired)</text>
    <text x="0" y="60" class="desc-text">Visualizes candidate journey from initial landing page to receiving multiple FAANG job offers.</text>
  </g>

  <!-- Flow Lines (Connections) -->
  <g id="connections">
    <line x1="200" y1="170" x2="230" y2="170" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="180.0" y="158.0" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="215.0" y="169.0" text-anchor="middle" class="flow-label">Start</text>
    <line x1="390" y1="170" x2="420" y2="170" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="370.0" y="158.0" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="405.0" y="169.0" text-anchor="middle" class="flow-label">Authorize</text>
    <line x1="580" y1="170" x2="610" y2="170" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="560.0" y="158.0" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="595.0" y="169.0" text-anchor="middle" class="flow-label">Configure</text>
    <line x1="770" y1="170" x2="800" y2="170" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="750.0" y="158.0" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="785.0" y="169.0" text-anchor="middle" class="flow-label">Render</text>
    <line x1="880" y1="210" x2="880" y2="280" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="845.0" y="233.0" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="880.0" y="244.0" text-anchor="middle" class="flow-label">Diagnose</text>
    <line x1="800" y1="320" x2="770" y2="320" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="750.0" y="308.0" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="785.0" y="319.0" text-anchor="middle" class="flow-label">Tailor</text>
    <line x1="515" y1="320" x2="390" y2="320" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="417.5" y="308.0" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="452.5" y="319.0" text-anchor="middle" class="flow-label">Master Interview</text>
  </g>

  <!-- Node Elements -->
  <g id="nodes">
    <g transform="translate(40, 130)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="160" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#38bdf8" />
      <text x="14" y="24" class="node-title">1. Discovery & Welcome</text>
      <text x="14" y="44" class="node-desc">Welcome splash (/welcome) &</text>
      <text x="14" y="58" class="node-desc">Interactive Landing Page (/)</text>
    </g>
    <g transform="translate(230, 130)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="160" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#0a66c2" />
      <text x="14" y="24" class="node-title">2. LinkedIn Auth</text>
      <text x="14" y="44" class="node-desc">1-Click OIDC login &</text>
      <text x="14" y="58" class="node-desc">zero-hallucination profile import</text>
    </g>
    <g transform="translate(420, 130)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="160" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#6366f1" />
      <text x="14" y="24" class="node-title">3. Onboarding Wizard</text>
      <text x="14" y="44" class="node-desc">Selects target role, seniority</text>
      <text x="14" y="58" class="node-desc">level, and industry goals</text>
    </g>
    <g transform="translate(610, 130)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="160" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#a855f7" />
      <text x="14" y="24" class="node-title">4. Resume Studio</text>
      <text x="14" y="44" class="node-desc">Builds resume in 24+ templates</text>
      <text x="14" y="58" class="node-desc">with Google XYZ AI rewriter</text>
    </g>
    <g transform="translate(800, 130)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="160" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#f59e0b" />
      <text x="14" y="24" class="node-title">5. ATS Diagnostics</text>
      <text x="14" y="44" class="node-desc">Analyzes ATS compliance score</text>
      <text x="14" y="58" class="node-desc">(target >90%)</text>
    </g>
    <g transform="translate(800, 280)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="160" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#ec4899" />
      <text x="14" y="24" class="node-title">6. Job Tailor Engine</text>
      <text x="14" y="44" class="node-desc">Pastes job description to match</text>
      <text x="14" y="58" class="node-desc">keywords & resolve gaps</text>
    </g>
    <g transform="translate(515, 280)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="255" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#14b8a6" />
      <text x="14" y="24" class="node-title">7. Voice Interview Prep</text>
      <text x="14" y="44" class="node-desc">Practices with AI coach in 12</text>
      <text x="14" y="58" class="node-desc">Indian regional languages</text>
    </g>
    <g transform="translate(135, 280)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="255" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#22c55e" />
      <text x="14" y="24" class="node-title">8. Hired at Dream Job! 🚀</text>
      <text x="14" y="44" class="node-desc">Tracks applications in Kanban</text>
      <text x="14" y="58" class="node-desc">pipeline and negotiates offer</text>
    </g>
  </g>
</svg>