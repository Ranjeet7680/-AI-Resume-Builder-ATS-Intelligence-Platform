<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Accent Glow -->
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <!-- Drop Shadows and Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#a855f7" />
    </marker>
  </defs>

  <style>
    .title-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #ffffff; }
    .desc-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11px; fill: #94a3b8; }
    .badge-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 800; fill: #a855f7; letter-spacing: 1.5px; }
    .node-title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #f8fafc; }
    .node-desc { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 10px; fill: #94a3b8; }
    .flow-label { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 9px; fill: #38bdf8; font-weight: 500; }

    /* Animations */
    @keyframes pulseGlow {
      0% { stroke-opacity: 0.4; }
      50% { stroke-opacity: 1; }
      100% { stroke-opacity: 0.4; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes indicatorPulse {
      0% { r: 3px; opacity: 1; }
      50% { r: 6px; opacity: 0.4; }
      100% { r: 3px; opacity: 1; }
    }

    .animated-border { stroke: #a855f7; animation: pulseGlow 3s infinite ease-in-out; }
    .animated-flow { stroke: #a855f7; stroke-dasharray: 6, 6; animation: flowLine 1.8s linear infinite; }
    .pulse-dot { fill: #a855f7; animation: indicatorPulse 2s infinite ease-in-out; }
  </style>

  <!-- Container Box -->
  <rect x="10" y="10" width="980" height="500" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  <rect x="10" y="10" width="980" height="500" rx="16" fill="none" class="animated-border" stroke-width="1.5" />

  <!-- Header Section -->
  <g transform="translate(35, 30)">
    <rect x="0" y="0" width="170" height="22" rx="11" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" />
    <circle cx="12" cy="11" r="4" class="pulse-dot" />
    <text x="24" y="14" class="badge-text">MULTI-AGENT AI CLUSTER</text>

    <text x="0" y="44" class="title-text">Gemini 1.5 Pro / Flash Multi-Agent AI Orchestration</text>
    <text x="0" y="60" class="desc-text">Intelligent latency and cost-optimizing router switching between Gemini 1.5 Flash and Pro.</text>
  </g>

  <!-- Flow Lines (Connections) -->
  <g id="connections">
    <line x1="230" y1="170" x2="270" y2="170" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="215.0" y="158.0" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="250.0" y="169.0" text-anchor="middle" class="flow-label">Incoming Task</text>
    <line x1="470" y1="150" x2="540" y2="115" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="470.0" y="120.5" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="505.0" y="131.5" text-anchor="middle" class="flow-label">Low Latency Route</text>
    <line x1="470" y1="170" x2="540" y2="215" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="470.0" y="180.5" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="505.0" y="191.5" text-anchor="middle" class="flow-label">Deep Analysis Route</text>
    <line x1="650" y1="250" x2="650" y2="280" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="615.0" y="253.0" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="650.0" y="264.0" text-anchor="middle" class="flow-label">Output Validation</text>
    <line x1="540" y1="315" x2="470" y2="315" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="470.0" y="303.0" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="505.0" y="314.0" text-anchor="middle" class="flow-label">Fallback on Error</text>
  </g>

  <!-- Node Elements -->
  <g id="nodes">
    <g transform="translate(40, 130)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="190" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#0ea5e9" />
      <text x="14" y="24" class="node-title">Client AI Request</text>
      <text x="14" y="44" class="node-desc">Bullet rewrite, ATS score, mock</text>
      <text x="14" y="58" class="node-desc">interview or voice chat</text>
    </g>
    <g transform="translate(270, 130)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="200" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#a855f7" />
      <text x="14" y="24" class="node-title">Intelligent AI Router</text>
      <text x="14" y="44" class="node-desc">Assesses token complexity,</text>
      <text x="14" y="58" class="node-desc">latency sensitivity, and budget</text>
    </g>
    <g transform="translate(540, 80)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="220" height="70" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="70" rx="2" fill="#10b981" />
      <text x="14" y="24" class="node-title">Gemini 1.5 Flash (Tier 1)</text>
      <text x="14" y="44" class="node-desc">Sub-second tasks: Grammar fix,</text>
      <text x="14" y="58" class="node-desc">keyword extract, quick tips</text>
    </g>
    <g transform="translate(540, 180)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="220" height="70" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="70" rx="2" fill="#6366f1" />
      <text x="14" y="24" class="node-title">Gemini 1.5 Pro (Tier 2)</text>
      <text x="14" y="44" class="node-desc">Deep reasoning: Mock interview,</text>
      <text x="14" y="58" class="node-desc">salary coaching, full rewrite</text>
    </g>
    <g transform="translate(540, 280)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="220" height="70" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="70" rx="2" fill="#f59e0b" />
      <text x="14" y="24" class="node-title">Structured JSON Enforcer</text>
      <text x="14" y="44" class="node-desc">Guarantees valid Pydantic V2</text>
      <text x="14" y="58" class="node-desc">schema output</text>
    </g>
    <g transform="translate(270, 280)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="200" height="70" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="70" rx="2" fill="#ec4899" />
      <text x="14" y="24" class="node-title">Resilient Fallback Cache</text>
      <text x="14" y="44" class="node-desc">Cached responses & offline rule</text>
      <text x="14" y="58" class="node-desc">fallback during rate limits</text>
    </g>
  </g>
</svg>