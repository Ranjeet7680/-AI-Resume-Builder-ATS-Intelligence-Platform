<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Accent Glow -->
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <!-- Drop Shadows and Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#14b8a6" />
    </marker>
  </defs>

  <style>
    .title-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #ffffff; }
    .desc-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11px; fill: #94a3b8; }
    .badge-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 800; fill: #14b8a6; letter-spacing: 1.5px; }
    .node-title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #f8fafc; }
    .node-desc { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 10px; fill: #94a3b8; }
    .flow-label { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 9px; fill: #38bdf8; font-weight: 500; }

    /* Animations */
    @keyframes pulseGlow {
      0% { stroke-opacity: 0.4; }
      50% { stroke-opacity: 1; }
      100% { stroke-opacity: 0.4; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes indicatorPulse {
      0% { r: 3px; opacity: 1; }
      50% { r: 6px; opacity: 0.4; }
      100% { r: 3px; opacity: 1; }
    }

    .animated-border { stroke: #14b8a6; animation: pulseGlow 3s infinite ease-in-out; }
    .animated-flow { stroke: #14b8a6; stroke-dasharray: 6, 6; animation: flowLine 1.8s linear infinite; }
    .pulse-dot { fill: #14b8a6; animation: indicatorPulse 2s infinite ease-in-out; }
  </style>

  <!-- Container Box -->
  <rect x="10" y="10" width="980" height="500" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  <rect x="10" y="10" width="980" height="500" rx="16" fill="none" class="animated-border" stroke-width="1.5" />

  <!-- Header Section -->
  <g transform="translate(35, 30)">
    <rect x="0" y="0" width="170" height="22" rx="11" fill="#0f172a" stroke="#14b8a6" stroke-width="1.2" />
    <circle cx="12" cy="11" r="4" class="pulse-dot" />
    <text x="24" y="14" class="badge-text">INTERVIEW SIMULATION</text>

    <text x="0" y="44" class="title-text">Voice Mock Interview Simulator & Performance Evaluator</text>
    <text x="0" y="60" class="desc-text">State machine conducting realistic mock interviews with dynamic questioning and 4-pillar scoring.</text>
  </g>

  <!-- Flow Lines (Connections) -->
  <g id="connections">
    <line x1="220" y1="170" x2="260" y2="170" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="205.0" y="158.0" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="240.0" y="169.0" text-anchor="middle" class="flow-label">Config</text>
    <line x1="460" y1="170" x2="500" y2="170" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="445.0" y="158.0" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="480.0" y="169.0" text-anchor="middle" class="flow-label">AI Asks Question</text>
    <line x1="690" y1="170" x2="730" y2="170" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="675.0" y="158.0" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="710.0" y="169.0" text-anchor="middle" class="flow-label">Candidate Responds</text>
    <line x1="825" y1="210" x2="825" y2="290" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="790.0" y="238.0" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="825.0" y="249.0" text-anchor="middle" class="flow-label">Scores Answer</text>
    <line x1="730" y1="330" x2="640" y2="330" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="650.0" y="318.0" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="685.0" y="329.0" text-anchor="middle" class="flow-label">Session Complete</text>
    <line x1="730" y1="310" x2="460" y2="190" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="560.0" y="238.0" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="595.0" y="249.0" text-anchor="middle" class="flow-label">Next Question Loop</text>
  </g>

  <!-- Node Elements -->
  <g id="nodes">
    <g transform="translate(40, 130)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="180" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#64748b" />
      <text x="14" y="24" class="node-title">Interview Setup</text>
      <text x="14" y="44" class="node-desc">Target company, role &</text>
      <text x="14" y="58" class="node-desc">seniority level selected</text>
    </g>
    <g transform="translate(260, 130)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="200" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#0ea5e9" />
      <text x="14" y="24" class="node-title">Dynamic Question Engine</text>
      <text x="14" y="44" class="node-desc">Generates behavioral, system</text>
      <text x="14" y="58" class="node-desc">design & technical questions</text>
    </g>
    <g transform="translate(500, 130)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="190" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#14b8a6" />
      <text x="14" y="24" class="node-title">Candidate Audio Answer</text>
      <text x="14" y="44" class="node-desc">Real-time speech transcription</text>
      <text x="14" y="58" class="node-desc">& pacing monitor</text>
    </g>
    <g transform="translate(730, 130)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="190" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#a855f7" />
      <text x="14" y="24" class="node-title">4-Pillar Evaluation</text>
      <text x="14" y="44" class="node-desc">1. STAR Alignment • 2.</text>
      <text x="14" y="58" class="node-desc">Technical Depth • 3. Brevity • 4....</text>
    </g>
    <g transform="translate(730, 290)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="190" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#f59e0b" />
      <text x="14" y="24" class="node-title">Adaptive Follow-up</text>
      <text x="14" y="44" class="node-desc">AI interviewer challenges weak</text>
      <text x="14" y="58" class="node-desc">points or drills deeper</text>
    </g>
    <g transform="translate(380, 290)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="260" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#22c55e" />
      <text x="14" y="24" class="node-title">Comprehensive Scorecard</text>
      <text x="14" y="44" class="node-desc">Overall Score: 88% • Strengths,</text>
      <text x="14" y="58" class="node-desc">Weaknesses & Model Answers</text>
    </g>
  </g>
</svg>