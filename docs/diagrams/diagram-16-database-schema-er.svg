<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Accent Glow -->
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#336791" />
      <stop offset="100%" stop-color="#20466b" />
    </linearGradient>

    <!-- Drop Shadows and Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#336791" />
    </marker>
  </defs>

  <style>
    .title-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #ffffff; }
    .desc-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 11px; fill: #94a3b8; }
    .badge-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 800; fill: #336791; letter-spacing: 1.5px; }
    .node-title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #f8fafc; }
    .node-desc { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 10px; fill: #94a3b8; }
    .flow-label { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 9px; fill: #38bdf8; font-weight: 500; }

    /* Animations */
    @keyframes pulseGlow {
      0% { stroke-opacity: 0.4; }
      50% { stroke-opacity: 1; }
      100% { stroke-opacity: 0.4; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes indicatorPulse {
      0% { r: 3px; opacity: 1; }
      50% { r: 6px; opacity: 0.4; }
      100% { r: 3px; opacity: 1; }
    }

    .animated-border { stroke: #336791; animation: pulseGlow 3s infinite ease-in-out; }
    .animated-flow { stroke: #336791; stroke-dasharray: 6, 6; animation: flowLine 1.8s linear infinite; }
    .pulse-dot { fill: #336791; animation: indicatorPulse 2s infinite ease-in-out; }
  </style>

  <!-- Container Box -->
  <rect x="10" y="10" width="980" height="500" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  <rect x="10" y="10" width="980" height="500" rx="16" fill="none" class="animated-border" stroke-width="1.5" />

  <!-- Header Section -->
  <g transform="translate(35, 30)">
    <rect x="0" y="0" width="170" height="22" rx="11" fill="#0f172a" stroke="#336791" stroke-width="1.2" />
    <circle cx="12" cy="11" r="4" class="pulse-dot" />
    <text x="24" y="14" class="badge-text">DATABASE & PGVECTOR</text>

    <text x="0" y="44" class="title-text">Enterprise Relational ER & Vector Database Schema</text>
    <text x="0" y="60" class="desc-text">PostgreSQL 16 relational tables with JSONB document storage and pgvector high-dimensional embeddings.</text>
  </g>

  <!-- Flow Lines (Connections) -->
  <g id="connections">
    <line x1="270" y1="160" x2="340" y2="160" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="270.0" y="148.0" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="305.0" y="159.0" text-anchor="middle" class="flow-label">1 : N</text>
    <line x1="560" y1="160" x2="630" y2="160" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="560.0" y="148.0" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="595.0" y="159.0" text-anchor="middle" class="flow-label">Config Ref</text>
    <line x1="160" y1="200" x2="160" y2="280" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="125.0" y="228.0" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="160.0" y="239.0" text-anchor="middle" class="flow-label">1 : N</text>
    <line x1="450" y1="200" x2="450" y2="280" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="415.0" y="228.0" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="450.0" y="239.0" text-anchor="middle" class="flow-label">1 : N</text>
    <line x1="560" y1="320" x2="630" y2="320" class="animated-flow" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="560.0" y="308.0" width="70" height="15" rx="3" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
    <text x="595.0" y="319.0" text-anchor="middle" class="flow-label">Vector Link</text>
  </g>

  <!-- Node Elements -->
  <g id="nodes">
    <g transform="translate(50, 120)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="220" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#336791" />
      <text x="14" y="24" class="node-title">users</text>
      <text x="14" y="44" class="node-desc">id (PK), email, full_name,</text>
      <text x="14" y="58" class="node-desc">linkedin_id, role, tier, created_at</text>
    </g>
    <g transform="translate(340, 120)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="220" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#0ea5e9" />
      <text x="14" y="24" class="node-title">resumes</text>
      <text x="14" y="44" class="node-desc">id (PK), user_id (FK), title,</text>
      <text x="14" y="58" class="node-desc">content (JSONB), ats_score, is_pr...</text>
    </g>
    <g transform="translate(630, 120)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="220" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#8b5cf6" />
      <text x="14" y="24" class="node-title">templates</text>
      <text x="14" y="44" class="node-desc">id (PK), slug, name, category,</text>
      <text x="14" y="58" class="node-desc">font_family, color_palette, layout</text>
    </g>
    <g transform="translate(50, 280)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="220" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#10b981" />
      <text x="14" y="24" class="node-title">applications</text>
      <text x="14" y="44" class="node-desc">id (PK), user_id, resume_id,</text>
      <text x="14" y="58" class="node-desc">company, position, status, applie...</text>
    </g>
    <g transform="translate(340, 280)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="220" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#f59e0b" />
      <text x="14" y="24" class="node-title">job_matches</text>
      <text x="14" y="44" class="node-desc">id (PK), resume_id, raw_jd,</text>
      <text x="14" y="58" class="node-desc">match_score, skill_gaps (JSONB)</text>
    </g>
    <g transform="translate(630, 280)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="220" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#ec4899" />
      <text x="14" y="24" class="node-title">vector_embeddings</text>
      <text x="14" y="44" class="node-desc">id (PK), entity_id,</text>
      <text x="14" y="58" class="node-desc">entity_type, embedding (vector[15...</text>
    </g>
  </g>
</svg>