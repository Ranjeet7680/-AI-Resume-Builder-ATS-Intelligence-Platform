<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="40%" stop-color="#0b1329" />
      <stop offset="80%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="25%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="75%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    @keyframes pulseCard {
      0% { stroke-opacity: 0.3; }
      50% { stroke-opacity: 0.9; }
      100% { stroke-opacity: 0.3; }
    }
    @keyframes pulseRing {
      0% { r: 4px; opacity: 1; }
      50% { r: 9px; opacity: 0.2; }
      100% { r: 4px; opacity: 1; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }

    .hero-border { stroke: #38bdf8; animation: pulseCard 3.5s infinite ease-in-out; }
    .status-ping { fill: #10b981; animation: pulseRing 2s infinite ease-in-out; }
    .floating-badge { animation: floatParticle 4s infinite ease-in-out; }
  </style>

  <!-- Background Rect -->
  <rect x="10" y="10" width="1180" height="340" rx="20" fill="url(#heroBg)" stroke="#1e293b" stroke-width="2" />
  <rect x="10" y="10" width="1180" height="340" rx="20" fill="url(#grid)" />
  <rect x="10" y="10" width="1180" height="340" rx="20" fill="none" class="hero-border" stroke-width="1.8" />

  <!-- Live Status Chip -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.2" />
    <circle cx="16" cy="14" r="5" fill="#10b981" />
    <circle cx="16" cy="14" r="5" class="status-ping" />
    <text x="32" y="18" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399" letter-spacing="1">PRODUCTION SAAS OS v2.0</text>
  </g>

  <!-- Wiki Badge Chip -->
  <g transform="translate(295, 45)">
    <rect x="0" y="0" width="240" height="28" rx="14" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" />
    <circle cx="16" cy="14" r="4" fill="#a855f7" />
    <text x="30" y="18" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700" fill="#c084fc" letter-spacing="0.5">22+ ANIMATED WIKI DIAGRAMS</text>
  </g>

  <!-- Main Hero Titles -->
  <g transform="translate(60, 125)">
    <text x="0" y="0" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="40" font-weight="900" fill="#ffffff" letter-spacing="-1">
      AI Resume Builder &amp; ATS Intelligence Platform
    </text>
    <text x="0" y="38" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#38bdf8" letter-spacing="-0.2">
      The Autonomous AI Career Operating System &amp; Placement Engine
    </text>
    <text x="0" y="70" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8">
      LinkedIn OIDC • 24+ Multi-Template Studio • Google XYZ Rewriter • 12 Indian Languages Voice Coach • pgvector Job Match
    </text>
  </g>

  <!-- Highlight Feature Cards at Bottom -->
  <g transform="translate(60, 235)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="250" height="75" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <rect x="0" y="0" width="5" height="75" rx="2" fill="#38bdf8" />
      <text x="18" y="28" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">🎯 Hybrid ATS Engine</text>
      <text x="18" y="48" font-family="'Inter', system-ui, sans-serif" font-size="10.5" fill="#94a3b8">30% Keyword • 20% Hard Skills</text>
      <text x="18" y="62" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#38bdf8">Deterministic 0-100 scoring</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(270, 0)">
      <rect x="0" y="0" width="250" height="75" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <rect x="0" y="0" width="5" height="75" rx="2" fill="#818cf8" />
      <text x="18" y="28" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">🎨 24+ Resume Studio</text>
      <text x="18" y="48" font-family="'Inter', system-ui, sans-serif" font-size="10.5" fill="#94a3b8">7 Categories • 8 Color Themes</text>
      <text x="18" y="62" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#818cf8">Zero content loss switching</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(540, 0)">
      <rect x="0" y="0" width="250" height="75" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <rect x="0" y="0" width="5" height="75" rx="2" fill="#c084fc" />
      <text x="18" y="28" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">🎤 12 Indian Langs Voice</text>
      <text x="18" y="48" font-family="'Inter', system-ui, sans-serif" font-size="10.5" fill="#94a3b8">Hindi, Tamil, Telugu, Marathi, etc.</text>
      <text x="18" y="62" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#c084fc">Voice mock interview simulator</text>
    </g>

    <!-- Card 4 -->
    <g transform="translate(810, 0)">
      <rect x="0" y="0" width="270" height="75" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <rect x="0" y="0" width="5" height="75" rx="2" fill="#34d399" />
      <text x="18" y="28" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">⚡ 1-Click 5 Versions</text>
      <text x="18" y="48" font-family="'Inter', system-ui, sans-serif" font-size="10.5" fill="#94a3b8">ATS, Modern, Tailored, One-Page</text>
      <text x="18" y="62" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#34d399">Vector PDF &amp; DOCX Export</text>
    </g>
  </g>
</svg>