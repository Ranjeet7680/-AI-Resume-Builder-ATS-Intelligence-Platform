services:
  # FastAPI Backend Service
  - type: web
    name: ai-resume-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: ai-resume-db
          property: connectionString

  # Next.js 14 Frontend Service (or deploy to Vercel)
  - type: web
    name: ai-resume-frontend
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: ai-resume-backend
          property: host

databases:
  - name: ai-resume-db
    databaseName: resume_builder
    user: postgres
    plan: free
